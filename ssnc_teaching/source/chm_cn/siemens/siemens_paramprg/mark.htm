  <tr>
    <td>标记符――程序跳转目标</td>
  </tr>
</table>
<p><strong>1.</strong><strong>功能 </strong><br>
  1）标记符用于标记程序中所跳转的目标程序段，用跳转功能可以实现程序运行分支。 <br>
  2）标记符可以自由选取，但必须由2一个字母或数字组成，其中开始两个符号必须是字 <br>
  母或下划线。 <br>
  3)跳转目标程序段中标记符后面必须为冒号。标记符位于程序段段首。如果程序段有段 <br>
  号，则标记符紧跟着段号。 <br>
  4)在一个程序段中，标记符不能含有其它意义。 </p>
<p><br>
  <strong>2.</strong><strong>程序举例 </strong><br>
  N10 MARKE1:G1  X20 ；MARKE1为标记符，跳转目标程序段 <br>
  ...<br>
  TR789:G0 X10  Z20 ；TR789为标记符，跳转目标程序段没有段号 </p>
