    <td><span class="title2">绝对跳转</span></td>
  </tr>
</table>
<p><strong></strong><strong>1.</strong><strong>功能 </strong><br>
NC程序在运行时以写入时的顺序执行程序段。 <br>
程序在运行时可以通过插入程序跳转指令改变执行顺序。 <br>
跳转目标只能是有标记符的程序段。此程序段必须位于该程序之内。 <br>
绝对跳转指令必须占用一个独立的程序段。 </p>
<p><strong>2.</strong><strong>编程 </strong><br>
  GOTOF Lable  ；先前跳转 <br>
  GOTOB Lable  ；向后跳转 <br>
  AWL 说明 <br>
  GOTOF 向前跳转（向程序结束的方向跳转） <br>
  GOTOB 向后跳转（向程序开始的方向跳转） <br>
Lable  所选的标记符 </p>
