model:
  model_name: "Virtu-Omni-10B"
  param_scale: "10B"
  num_layers: 48
  hidden_dim: 4096
  intermediate_dim: 12288
  num_attention_heads: 32
  num_kv_heads: 8
  head_dim: 128
  vocab_size: 128000
  vision_codebook_size: 16384
  image_resolution: 448
  patch_size: 14
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-06
  rope_theta: 100000.0
  initializer_range: 0.02
  use_qk_norm: true
  dropout_prob: 0.0
  max_loop_steps: 1
  convergence_threshold: 0.0001
  enable_state_cache: true
  loop_norm_type: "rms"
  loop_gating: true
  adaptive_loop: true
  loop_exit_metric: "relative_l2"
