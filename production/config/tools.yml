# 刀具清单（AE-CI-258 量产）
# 几何单位 mm；Taylor 寿命模型 VT^n = C 以 V(m/min)、T(min) 计，常数按目标寿命反标定。
tools:
  T1:
    name: "D16 四刃整体硬质合金立铣刀"
    type: endmill
    diameter_mm: 16.0
    flutes: 4
    flute_length_mm: 40.0
    gauge_length_mm: 75.0
    shank_diameter_mm: 16.0
    material: "整体硬质合金（细晶粒）"
    coating: "AlCrN"
    holder: {diameter_mm: 50.0, length_mm: 60.0}
    taylor: {C: 90.0, n: 0.25}
    life_target_min: 45
  T2:
    name: "D10 棒棒糖刀（球头加长，流道专用）"
    type: lollipop
    diameter_mm: 10.0
    flutes: 4
    flute_length_mm: 30.0
    gauge_length_mm: 90.0
    shank_diameter_mm: 10.0
    material: "整体硬质合金（细晶粒）"
    coating: "AlCrN"
    holder: {diameter_mm: 50.0, length_mm: 60.0}
    taylor: {C: 82.0, n: 0.25}
    life_target_min: 40
